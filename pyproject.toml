[project]
name = "flights-mcp"
version = "1.0.0"
description = "Local stdio MCP server for live public flight search. No API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "flights", "google-flights"]
dependencies = [
    "mcp==2.2.0",
    "fast-flights==3.1.0",
    "airportsdata==20260905",
    "primp==2.0.1",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
flights-mcp = "flights_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flights_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits Google Flights over the network (set FLIGHTS_LIVE=1)",
]
